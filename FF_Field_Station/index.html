<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FF Field Station</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .racing-font { font-family: 'Orbitron', sans-serif; }
        .btn-tap:active { transform: scale(0.95); transition: transform 0.1s; }
        select { -webkit-appearance: none; appearance: none; padding: 12px !important; border-radius: 12px !important; text-align: center; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input { border-radius: 16px !important; outline: none !important; }
        .slide-in { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function FieldApp() {
            // Local Data
            const [station, setStation] = useState('TC');
            const [ss, setSS] = useState('1');
            const [ns, setNS] = useState('');
            const [jam, setJam] = useState('');
            const [history, setHistory] = useState([]);
            const [isDarkMode, setIsDarkMode] = useState(localStorage.getItem('ff_theme') !== 'light');
            
            // Fixed App Config
            const apiUrl = '';
            const [eventName, setEventName] = useState('FF FIELD');
            const [totalSS, setTotalSS] = useState(10);
            const [showSettings, setShowSettings] = useState(false);
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState('');

            // Apply Theme to Body
            useEffect(() => {
                document.body.className = isDarkMode ? 'bg-[#0f172a]' : 'bg-slate-50';
                localStorage.setItem('ff_theme', isDarkMode ? 'dark' : 'light');
            }, [isDarkMode]);

            // Fetch Data on Load or Change
            useEffect(() => {
                fetchEventDetails();
                fetchHistory();
            }, [station, ss]);

            const fetchEventDetails = async () => {
                try {
                    const response = await fetch(`${apiUrl}/api/event_details`);
                    const data = await response.json();
                    if (data.event_name) setEventName(data.event_name.toUpperCase());
                    if (data.total_ss) setTotalSS(parseInt(data.total_ss));
                } catch (e) { console.error("Event error:", e); }
            };

            const fetchHistory = async () => {
                try {
                    const response = await fetch(`${apiUrl}/api/recent_timing?station_type=${station}&ss=${ss}`);
                    const data = await response.json();
                    if (Array.isArray(data)) setHistory(data);
                } catch (e) { console.error("History error:", e); }
            };

            const handleTimeInputChange = (val) => {
                let formatted = val.replace(/[^0-9:]/g, '');
                if (formatted.length === 4 && !formatted.includes(':')) {
                    formatted = `${formatted.substring(0,2)}:${formatted.substring(2,4)}`;
                }
                if (formatted.length > 5) return;
                setJam(formatted);
            };

            const captureNow = () => {
                if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(60);
                const now = new Date();
                const timeStr = now.toLocaleTimeString('id-ID', { hour12: false, hour: '2-digit', minute: '2-digit' });
                setJam(timeStr);
            };

            const handleSave = async () => {
                if (window.navigator && window.navigator.vibrate) window.navigator.vibrate([40, 30, 40]);
                if(!ns || !jam) { alert("Isi NS dan Jam!"); return; }
                setLoading(true);
                try {
                    const response = await fetch(`${apiUrl}/api/save_timing`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ station_type: station, ss: ss, ns: ns, jam: jam })
                    });
                    const res = await response.json();
                    if(res.status === 'success') {
                        setMessage('Data Terkirim!');
                        setTimeout(() => { fetchHistory(); setMessage(''); }, 1000);
                        handleClear();
                    } else { alert("Gagal: " + res.message); }
                } catch (e) { alert("Koneksi Error!"); }
                setLoading(false);
            };

            const handleClear = () => { setNS(''); setJam(''); };

            const theme = isDarkMode 
                ? { bg: 'bg-[#0a0f1e]', card: 'bg-slate-800/30 border-white/5', text: 'text-white', sub: 'text-indigo-300/60', input: 'bg-slate-800/50 border-white/10' }
                : { bg: 'bg-slate-50', card: 'bg-white border-slate-200 shadow-sm', text: 'text-slate-900', sub: 'text-slate-500', input: 'bg-white border-slate-300' };

            return (
                <div className={`flex flex-col h-[100dvh] max-w-md mx-auto p-4 pb-8 relative overflow-hidden transition-all duration-500 ${theme.bg} ${theme.text}`}>
                    <header className="flex justify-between items-center mb-6">
                        <div className="flex items-center gap-2">
                             <div className="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center">
                                <i className="fas fa-satellite-dish text-white text-xs"></i>
                             </div>
                             <h1 className="text-xl font-bold tracking-tight racing-font">{eventName}</h1>
                        </div>
                        <button 
                            onClick={() => setShowSettings(true)}
                            className={`w-10 h-10 rounded-xl flex items-center justify-center border active:scale-90 transition-all ${isDarkMode ? 'bg-slate-800 text-indigo-400 border-white/5' : 'bg-white text-indigo-600 border-slate-200'}`}
                        >
                            <i className="fas fa-palette"></i>
                        </button>
                    </header>

                    {/* Mode Selector */}
                    <div className={`grid grid-cols-2 gap-3 mb-6 p-1.5 rounded-2xl border ${isDarkMode ? 'bg-slate-800/50 border-white/5' : 'bg-slate-200/50 border-slate-300/30'}`}>
                        <button onClick={() => setStation('TC')} className={`py-3 rounded-xl font-bold transition-all ${station === 'TC' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400'}`}>TC STATION</button>
                        <button onClick={() => setStation('START')} className={`py-3 rounded-xl font-bold transition-all ${station === 'START' ? 'bg-green-600 text-white shadow-lg' : 'text-slate-400'}`}>START LINE</button>
                    </div>

                    <div className="space-y-6 flex-grow overflow-y-auto pb-6">
                        <div className="grid grid-cols-2 gap-4">
                            <div className="flex flex-col gap-4">
                                <div className="flex flex-col gap-1.5">
                                    <label className={`text-[10px] font-bold uppercase tracking-widest px-1 ${theme.sub}`}>Special Stage</label>
                                    <select value={ss} onChange={(e) => setSS(e.target.value)} className={`w-full text-lg font-bold border ${theme.input}`}>
                                        {[...Array(totalSS)].map((_, i) => <option key={i+1} value={i+1}>SS {i+1}</option>)}
                                    </select>
                                </div>
                                <button onClick={captureNow} className={`w-full py-8 rounded-3xl border-2 border-dashed flex flex-col items-center justify-center gap-2 active:scale-95 transition-all ${isDarkMode ? 'border-indigo-500/30 active:bg-indigo-500/10' : 'border-indigo-300 active:bg-indigo-50'}`}>
                                    <i className="fas fa-stopwatch text-2xl text-indigo-500"></i>
                                    <span className="font-black text-indigo-500 text-[10px] uppercase text-center leading-none">TAP TO<br/>CAPTURE</span>
                                </button>
                            </div>
                            <div className="flex flex-col gap-4">
                                <div className="flex flex-col gap-1.5">
                                    <label className={`text-[10px] font-bold uppercase tracking-widest px-1 ${theme.sub}`}>Car Number (NS)</label>
                                    <input type="number" pattern="\d*" placeholder="000" value={ns} onChange={(e) => setNS(e.target.value)} className={`w-full text-2xl font-bold racing-font text-center border ${theme.input}`} />
                                </div>
                                <div className={`flex flex-col gap-2 rounded-2xl p-2 border h-[105px] ${theme.card}`}>
                                    <label className={`text-[9px] font-bold uppercase text-center ${theme.sub}`}>Recent Cars</label>
                                    <div className="grid grid-cols-3 gap-1.5 overflow-y-auto pr-0.5">
                                        {history.length === 0 && <span className="col-span-3 text-[9px] text-slate-400 mt-2 italic text-center">None</span>}
                                        {history.map((h, i) => <div key={i} className={`text-xs font-black py-2 rounded-lg border text-center ${isDarkMode ? 'bg-slate-700/50 text-indigo-200 border-white/5' : 'bg-slate-100 text-indigo-700 border-slate-200'}`}>#{h}</div>)}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className={`flex flex-col gap-2 p-4 rounded-3xl border outline outline-2 ${theme.card} ${isDarkMode ? 'outline-white/5' : 'outline-slate-50'}`}>
                            <label className={`text-[10px] font-bold uppercase tracking-widest text-center ${theme.sub}`}>Time (HH:MM)</label>
                            <input type="text" placeholder="-- : --" value={jam} onChange={(e) => handleTimeInputChange(e.target.value)} className="w-full text-4xl font-bold tracking-wider py-4 racing-font text-center bg-transparent border-none focus:ring-0" />
                        </div>

                        {message && <div className="bg-green-500/20 border border-green-500/40 text-green-500 py-3 rounded-xl text-center font-bold text-xs animate-pulse tracking-wide uppercase">✓ {message}</div>}
                    </div>

                    <div className="grid grid-cols-2 gap-4 mt-auto">
                        <button onClick={handleClear} className={`font-bold py-4 rounded-2xl border flex items-center justify-center gap-2 ${isDarkMode ? 'bg-slate-800/50 border-white/5' : 'bg-white border-slate-200 shadow-sm'}`}><i className="fas fa-trash-alt opacity-40"></i> CLEAR</button>
                        <button onClick={() => alert("Dibatalkan!")} className={`font-bold py-4 rounded-2xl border flex items-center justify-center gap-2 ${isDarkMode ? 'bg-slate-800/50 border-white/5' : 'bg-white border-slate-200 shadow-sm'}`}><i className="fas fa-times opacity-40"></i> CANCEL</button>
                    </div>
                    
                    <button onClick={handleSave} disabled={loading} className={`w-full py-5 rounded-3xl font-bold text-2xl flex items-center justify-center gap-3 mt-4 btn-tap ${loading ? 'bg-indigo-800' : 'bg-indigo-600'} text-white shadow-2xl shadow-indigo-600/40`}>
                        {loading ? <i className="fas fa-spinner fa-spin"></i> : <><i className="fas fa-paper-plane"></i> SIMPAN & SEND</>}
                    </button>

                    {/* Theme Toggle Overlay */}
                    {showSettings && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-end">
                            <div className={`w-full p-8 rounded-t-[40px] border-t slide-in ${isDarkMode ? 'bg-slate-900 border-indigo-500/30' : 'bg-white border-slate-200'}`}>
                                <div className="w-12 h-1.5 bg-slate-700/20 rounded-full mx-auto mb-8"></div>
                                <h2 className="text-2xl font-bold mb-8 flex items-center gap-3"><i className="fas fa-palette text-indigo-500"></i> App Theme</h2>
                                <div className="grid grid-cols-2 gap-6 mb-12">
                                    <button onClick={() => setIsDarkMode(false)} className={`flex flex-col items-center gap-3 p-6 rounded-3xl border-2 ${!isDarkMode ? 'border-indigo-600 bg-indigo-50' : 'border-slate-800 opacity-40'}`}>
                                        <i className={`fas fa-sun text-4xl ${!isDarkMode ? 'text-orange-500' : 'text-slate-400'}`}></i>
                                        <span className="font-bold">LIGHT</span>
                                    </button>
                                    <button onClick={() => setIsDarkMode(true)} className={`flex flex-col items-center gap-3 p-6 rounded-3xl border-2 ${isDarkMode ? 'border-indigo-600 bg-indigo-900/40' : 'border-slate-200 opacity-40'}`}>
                                        <i className={`fas fa-moon text-4xl ${isDarkMode ? 'text-yellow-400' : 'text-slate-400'}`}></i>
                                        <span className="font-bold">DARK</span>
                                    </button>
                                </div>
                                <button onClick={() => setShowSettings(false)} className="w-full py-5 rounded-2xl font-bold bg-indigo-600 text-white shadow-lg">DONE</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FieldApp />);
    </script>
</body>
</html>
