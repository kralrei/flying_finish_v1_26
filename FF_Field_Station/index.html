<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>FF Field Station v2 (Render Ready)</title>
    <!-- React & Tailwind CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --accent: #10b981;
            --danger: #ef4444;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: #f8fafc;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .racing-font { font-family: 'Orbitron', sans-serif; }

        .btn-tap {
            transition: transform 0.1s;
        }
        .btn-tap:active {
            transform: scale(0.96);
        }

        /* Custom Input Styling */
        input, select {
            background: rgba(15, 23, 42, 0.5) !important;
            border: 2px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 12px;
            color: white !important;
            padding: 12px !important;
        }
        input:focus { border-color: var(--primary) !important; outline: none; }

        .btn-glow { box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }
        .station-active { background: var(--primary); box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }

        /* Animation for Panels */
        .slide-in { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function FieldApp() {
            // Local Data
            const [station, setStation] = useState('TC');
            const [ss, setSS] = useState('1');
            const [ns, setNS] = useState('');
            const [jam, setJam] = useState(new Date().toLocaleTimeString('id-ID', { hour12: false, hour: '2-digit', minute: '2-digit' }));
            
            // App state
            const [apiUrl, setApiUrl] = useState(localStorage.getItem('ff_api_url') || 'https://conservative-jacquenetta-kralrei-indonesia-ba3ddee7.koyeb.app');
            const [eventName, setEventName] = useState('FF FIELD');
            const [totalSS, setTotalSS] = useState(10);
            const [showSettings, setShowSettings] = useState(false);
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState('');

            // Fetch Event Name on Load
            useEffect(() => {
                fetchEventDetails();
            }, [apiUrl]);

            const fetchEventDetails = async () => {
                try {
                    const response = await fetch(`${apiUrl}/api/event_details`);
                    const data = await response.json();
                    if (data.event_name) setEventName(data.event_name.toUpperCase());
                    if (data.total_ss) setTotalSS(parseInt(data.total_ss));
                } catch (e) {
                    console.error("Failed to fetch event name:", e);
                }
            };

            const [history, setHistory] = useState([]);

            // Fetch History from Database
            const fetchHistory = async () => {
                try {
                    const response = await fetch(`${apiUrl}/api/recent_timing?station_type=${station}&ss=${ss}`);
                    const data = await response.json();
                    if (Array.isArray(data)) {
                        setHistory(data);
                    }
                } catch (e) {
                    console.error("Failed to fetch history:", e);
                }
            };

            // Initial Load and Auto-Refresh on Change
            useEffect(() => {
                fetchEventDetails();
                fetchHistory(); // Load from DB
            }, [apiUrl, station, ss]); // Trigger when station or SS changes

            const handleTimeInputChange = (val) => {
                let formatted = val.replace(/[^0-9:]/g, '');
                if (formatted.length === 4 && !formatted.includes(':')) {
                    formatted = `${formatted.substring(0,2)}:${formatted.substring(2,4)}`;
                }
                if (formatted.length > 5) return;
                setJam(formatted);
            };

            const captureNow = () => {
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(60);
                }
                const now = new Date();
                const timeStr = now.toLocaleTimeString('id-ID', { hour12: false, hour: '2-digit', minute: '2-digit' });
                setJam(timeStr);
            };

            const handleSave = async () => {
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate([40, 30, 40]);
                }
                if(!ns || !jam) {
                    alert("Isi NS dan Jam!");
                    return;
                }
                setLoading(true);
                try {
                    const response = await fetch(`${apiUrl}/api/save_timing`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            station_type: station,
                            ss: ss,
                            ns: ns,
                            jam: jam
                        })
                    });
                    const res = await response.json();
                    if(res.status === 'success') {
                        setMessage('Data Terkirim!');
                        
                        // Wait a tiny bit then refresh history from DB
                        setTimeout(() => {
                            fetchHistory();
                            setMessage('');
                        }, 1000);
                        
                        handleClear();
                    } else {
                        alert("Gagal Terkirim: " + res.message);
                    }
                } catch (e) {
                    alert("Koneksi Error: Periksa Alamat API Server Anda di Settings.");
                }
                setLoading(false);
            };

            const handleClear = () => {
                setNS('');
                setJam('');
            };

            const saveSettings = (url) => {
                setApiUrl(url);
                localStorage.setItem('ff_api_url', url);
                setShowSettings(false);
            };

            return (
                <div className="flex flex-col h-[100dvh] max-w-md mx-auto p-4 pb-8 relative overflow-hidden bg-[#0a0f1e]">
                    <header className="flex justify-between items-center mb-6">
                        <div className="flex items-center gap-2">
                             <div className="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center">
                                <i className="fas fa-satellite-dish text-white text-xs"></i>
                             </div>
                             <h1 className="text-xl font-bold tracking-tight racing-font text-white">{eventName}</h1>
                        </div>
                        <button 
                            onClick={() => setShowSettings(true)}
                            className="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-indigo-400 border border-indigo-400/20 active:scale-90 transition-all font-bold"
                        >
                            <i className="fas fa-cog"></i>
                        </button>
                    </header>

                    {/* Mode Selector */}
                    <div className="grid grid-cols-2 gap-3 mb-6 bg-slate-800/50 p-1.5 rounded-2xl border border-white/5">
                        <button 
                            onClick={() => setStation('TC')}
                            className={`py-3 rounded-xl font-bold transition-all btn-tap ${station === 'TC' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400'}`}
                        >
                            TC STATION
                        </button>
                        <button 
                            onClick={() => setStation('START')}
                            className={`py-3 rounded-xl font-bold transition-all btn-tap ${station === 'START' ? 'bg-green-600 text-white shadow-lg' : 'text-slate-400'}`}
                        >
                            START LINE
                        </button>
                    </div>

                    <div className="space-y-6 flex-grow overflow-y-auto pb-6">
                        
                        <div className="grid grid-cols-2 gap-4">
                            {/* Column LEFT: SS & Capture */}
                            <div className="flex flex-col gap-4">
                                <div className="flex flex-col gap-2">
                                    <label className="text-[10px] font-bold text-indigo-300/60 uppercase tracking-widest px-1">Special Stage</label>
                                    <select 
                                        value={ss} 
                                        onChange={(e) => setSS(e.target.value)}
                                        className="w-full text-lg font-bold bg-slate-800/50 border-white/10"
                                    >
                                        {[...Array(totalSS)].map((_, i) => (
                                            <option key={i+1} value={i+1}>SS {i+1}</option>
                                        ))}
                                    </select>
                                </div>

                                <button 
                                    onClick={captureNow}
                                    className={`w-full py-8 rounded-3xl border-2 border-dashed border-indigo-500/30 flex flex-col items-center justify-center gap-2 active:bg-indigo-500/20 active:scale-[0.98] transition-all group shadow-inner`}
                                >
                                    <i className="fas fa-stopwatch text-2xl text-indigo-400 group-active:scale-125 transition-transform"></i>
                                    <span className="font-black text-indigo-400 tracking-tighter text-[10px] uppercase">TAP TO<br/>CAPTURE</span>
                                </button>
                            </div>

                            {/* Column RIGHT: NS & RECENT CARS */}
                            <div className="flex flex-col gap-4">
                                <div className="flex flex-col gap-2">
                                    <label className="text-[10px] font-bold text-indigo-300/60 uppercase tracking-widest px-1">Car Number (NS)</label>
                                    <input 
                                        type="number" 
                                        pattern="\d*"
                                        placeholder="000"
                                        value={ns}
                                        onChange={(e) => setNS(e.target.value)}
                                        className="w-full text-2xl font-bold racing-font text-center bg-slate-800/50 border-white/10"
                                    />
                                </div>

                                <div className="flex flex-col gap-2 bg-slate-800/20 rounded-2xl p-2 border border-white/5 h-[105px]">
                                    <label className="text-[9px] font-bold text-slate-500 uppercase tracking-wider text-center">Recent Cars</label>
                                    <div className="grid grid-cols-3 gap-1.5 overflow-y-auto pr-0.5">
                                        {history.length === 0 && <span className="col-span-3 text-[9px] text-slate-600 mt-2 italic text-center">None</span>}
                                        {history.map((h, i) => (
                                            <div key={i} className="bg-slate-700/50 text-indigo-200 text-xs font-black py-2 rounded-lg border border-white/5 text-center animate-in fade-in zoom-in duration-300">#{h}</div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Jam Input Area */}
                        <div className="flex flex-col gap-2 bg-slate-800/20 p-4 rounded-3xl border border-white/5 outline outline-2 outline-white/5">
                            <label className="text-[10px] font-bold text-indigo-300/60 uppercase tracking-widest px-1 text-center">Time (HH:MM)</label>
                            <div className="relative">
                                <input 
                                    type="text" 
                                    placeholder="-- : --"
                                    value={jam}
                                    onChange={(e) => handleTimeInputChange(e.target.value)}
                                    className="w-full text-4xl font-bold tracking-wider py-4 racing-font text-center bg-transparent border-none text-white focus:ring-0"
                                />
                            </div>
                        </div>

                        {message && (
                            <div className="bg-green-500/20 border border-green-500/40 text-green-300 py-3 rounded-xl text-center font-bold animate-pulse text-xs">
                                <i className="fas fa-check-circle mr-2"></i> {message}
                            </div>
                        )}
                    </div>

                    {/* Action Buttons */}
                    <div className="grid grid-cols-2 gap-4 mt-auto">
                        <button 
                            onClick={handleClear}
                            className="bg-slate-800/50 text-white font-bold py-4 rounded-2xl border border-white/5 btn-tap flex items-center justify-center gap-2"
                        >
                            <i className="fas fa-trash-alt text-slate-400"></i> CLEAR
                        </button>
                        <button 
                             onClick={() => alert("Dibatalkan!")}
                             className="bg-slate-800/50 text-white font-bold py-4 rounded-2xl border border-white/5 btn-tap flex items-center justify-center gap-2"
                        >
                             <i className="fas fa-times text-slate-400"></i> CANCEL
                        </button>
                    </div>
                    
                    <button 
                        onClick={handleSave}
                        disabled={loading}
                        className={`w-full py-5 rounded-3xl font-bold text-2xl flex items-center justify-center gap-3 btn-tap mt-4 ${loading ? 'bg-indigo-800' : 'bg-indigo-600'} text-white shadow-2xl shadow-indigo-600/40 active:bg-indigo-500 focus:outline-none`}
                    >
                        {loading ? (
                             <i className="fas fa-spinner fa-spin"></i>
                        ) : (
                             <><i className="fas fa-paper-plane"></i> SIMPAN & SEND</>
                        )}
                    </button>

                    {/* Settings Panel Overlay */}
                    {showSettings && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-end slide-in">
                            <div className="bg-slate-900 w-full p-8 rounded-t-[40px] border-t border-indigo-500/30">
                                <div className="w-12 h-1.5 bg-slate-700 rounded-full mx-auto mb-8"></div>
                                <h2 className="text-2xl font-bold mb-6 flex items-center gap-3">
                                    <i className="fas fa-wifi text-indigo-400"></i> Server Settings
                                </h2>
                                <div className="flex flex-col gap-2 mb-8">
                                    <label className="text-sm font-semibold text-slate-400">Render API URL</label>
                                    <input 
                                        type="url" 
                                        placeholder="https://example.onrender.com"
                                        defaultValue={apiUrl}
                                        id="apiUrlInput"
                                        className="w-full text-lg"
                                    />
                                    <p className="text-xs text-slate-500 mt-2">Gunakan URL yang Anda dapatkan dari Render.com</p>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                     <button 
                                        onClick={() => setShowSettings(false)}
                                        className="py-4 rounded-2xl font-bold text-slate-400 bg-slate-800"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        onClick={() => saveSettings(document.getElementById('apiUrlInput').value)}
                                        className="py-4 rounded-2xl font-bold bg-indigo-600 text-white shadow-lg shadow-indigo-900/40"
                                    >
                                        Simpan
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FieldApp />);
    </script>
</body>
</html>
